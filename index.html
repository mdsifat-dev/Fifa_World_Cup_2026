<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fifa World Cup 2026</title>

    <!-- Favicon -->
    <link
      rel="shortcut icon"
      href="./assets/img/matches/football.png"
      type="image/x-icon"
    />

    <!-- Tailwind CSS cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Poppins font   -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- CSS link  -->
    <link rel="stylesheet" href="./styles/index.css" />

    <!-- font awesome cdn  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body class="box-border">
    <header>
      <section
        class="banner bg-[#161616] md:max-w-[1440px] sm:max-w-[800px] max-w-[400px] mx-auto sm:flex sm:flex-row flex-col justify-between items-center sm:rounded-[30px] sm:mt-13 md:text-left text-center rounded-[10px]"
      >
        <div class="banner-left text-white max-w-xl p-4 sm:p-13">
          <h2
            class="md:text-[70px] text-[1.5rem] sm:text-[42px] font-bold sm:leading-[80px] leading-10"
          >
            The Greatest show on the earth
          </h2>
          <p class="mt-5 mb-7">
            The official FIFA World Cup website is the primary digital hub for
            the 2026 tournament, offering fans comprehensive tools for planning
            and engagement.
          </p>
          <a
            href="#_"
            class="relative inline-flex items-center px-12 py-3 overflow-hidden text-lg font-medium text-[#ea0000] border-2 border-[#ea0000] rounded-full hover:font-bold hover:text-white group hover:bg-gray-50"
          >
            <span
              class="absolute left-0 block w-full h-0 transition-all bg-[#ea0000] opacity-100 group-hover:h-full top-1/2 group-hover:top-0 duration-400 ease"
            ></span>
            <span
              class="absolute right-0 flex items-center justify-start w-10 h-10 duration-300 transform translate-x-full group-hover:translate-x-0 ease"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M14 5l7 7m0 0l-7 7m7-7H3"
                ></path>
              </svg>
            </span>
            <span class="relative"> Watch Live </span>
          </a>
        </div>

        <div class="banner-right sm:pt-10 sm:pr-5 p-5 pb-0">
          <img class="w-auto" src="./assets/img/banner/banner-img.png" alt="" />
        </div>
      </section>
    </header>

    <main></main>
  </body>
</html>
